name: Release

# A tag like v0.2.0 (made by scripts/release.py) publishes a GitHub Release, but only after the checks have passed on the tagged commit.
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+*']
  workflow_dispatch:             # publish the release of a tag that already exists (GitHub starts no run when more than three tags are pushed at once)
    inputs:
      tag:
        description: 'Tag to publish, for example v0.2.0'
        required: true

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish the GitHub Release
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: The tag must match the version in package.json
        run: |
          test "${TAG}" = "v$(node -p "require('./package.json').version")" || { echo "tag ${TAG} does not match package.json"; exit 1; }
      - name: Release notes from CHANGELOG.md
        run: python scripts/release.py --notes "${TAG}" > release-notes.md
      - name: Create the release
        run: |
          flags=""
          case "${TAG}" in *-*) flags="--prerelease" ;; esac
          gh release create "${TAG}" --title "${GITHUB_REPOSITORY#*/} ${TAG#v}" --notes-file release-notes.md --verify-tag $flags
